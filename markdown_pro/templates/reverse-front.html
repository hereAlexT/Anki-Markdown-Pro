<link rel="stylesheet" href="./_mdpro-review.css" />
<div class="mdpro-wrapper">
  <div class="front"></div>
</div>
<!-- Reversed card: the Back field is the question. Only it may appear here
     so its audio (and only its audio) autoplays on the front. -->
<!-- prettier-ignore -->
<script id="data-question" type="text/plain">{{Back}}</script>
<script type="module">
  if (!document.getElementById("mdpro-frontside")) {
    const { render } = await import("./_mdpro-review.js");
    const question = document.getElementById("data-question").textContent;
    render(question, "");
  }
</script>
